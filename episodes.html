<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全部课程 · Pola News</title>
<link rel="icon" href="assets/pola.webp">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="top">
  <a href="index.html" class="logo">
    <img src="assets/pola.webp" alt="Pola">
    POLA NEWS<small>少儿英语学习平台</small>
  </a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="episodes.html" class="active">全部课程</a>
    <a href="about.html">关于Pola</a>
    <a href="#grid" class="btn-cta">开始学习</a>
  </div>
</nav>

<section class="section">
  <div class="wrap">
    <h2 class="section-title">全部<span class="em">课程</span></h2>
    <p class="section-sub">共 <strong id="totalCount"></strong> 期课程。选择级别浏览，勾选课程后可翻卡复习单词。</p>

    <!-- 级别标签 -->
    <div class="level-tabs" id="levelTabs"></div>

    <!-- 搜索 + 分类 -->
    <div class="controls">
      <div class="search-box">
        <span class="ic">🔍</span>
        <input type="text" id="search" placeholder="搜索课程标题或关键词…">
      </div>
      <div class="filters" id="filters"></div>
    </div>

    <div class="card-grid" id="grid"></div>
  </div>
</section>

<footer>
  <div class="flogo">🦘 POLA NEWS</div>
  <p>少儿英语学习平台 · A1 到 C1-C2 全级别覆盖</p>
  <p>为充满好奇心的小朋友而做 <span class="heart">♥</span></p>
</footer>

<!-- 翻卡复习浮窗 -->
<div id="reviewFloat" class="review-float" onclick="openReview()">
  📇 复习单词 <span class="review-count">0</span>
</div>

<!-- 翻卡复习弹窗 -->
<div id="reviewModal" class="review-modal">
  <div class="review-backdrop" onclick="closeReview()"></div>
  <div class="review-dialog">
    <div class="review-header">
      <span id="reviewCount">1 / 1</span>
      <button onclick="closeReview()" class="review-close">✕</button>
    </div>
    <div id="reviewCard" class="review-card" onclick="flipCard()">
      <div class="review-front">
        <div id="reviewWord" class="review-word"></div>
        <div class="review-hint">点击翻卡看释义</div>
      </div>
      <div class="review-back">
        <div id="reviewZh" class="review-zh"></div>
        <div id="reviewEx" class="review-ex"></div>
        <div id="reviewFrom" class="review-from"></div>
      </div>
    </div>
    <div class="review-nav">
      <button onclick="prevCard()" class="btn btn-ghost">← 上一个</button>
      <button onclick="shuffleCards()" class="btn btn-ghost">🔀 随机</button>
      <button onclick="nextCard()" class="btn btn-primary">下一个 →</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
var activeLevel = "all";
var activeCat = "all";
var query = "";

// URL 参数
(function(){
  var params = new URLSearchParams(location.search);
  var lv = params.get("level");
  if(lv && LEVELS[lv]) activeLevel = lv;
  var cat = params.get("cat");
  if(cat) activeCat = cat;
})();

document.getElementById("totalCount").textContent = EPISODES.length;

// 级别标签
(function(){
  var lc = levelCounts();
  var html = '<button class="level-tab '+(activeLevel==="all"?"active":"")+'" data-level="all">全部 ('+EPISODES.length+')</button>';
  Object.entries(LEVELS).forEach(function(entry){
    var k=entry[0], v=entry[1];
    html += '<button class="level-tab '+(activeLevel===k?"active":"")+'" data-level="'+k+'" style="--tab-color:'+v.color+'">'+v.emoji+' '+v.label+' ('+(lc[k]||0)+')</button>';
  });
  document.getElementById("levelTabs").innerHTML = html;
  document.getElementById("levelTabs").addEventListener("click", function(e){
    var b = e.target.closest(".level-tab");
    if(!b) return;
    document.querySelectorAll(".level-tab").forEach(function(t){t.classList.remove("active")});
    b.classList.add("active");
    activeLevel = b.dataset.level;
    renderFilters();
    render();
  });
})();

// 分类筛选
function renderFilters(){
  var f = document.getElementById("filters");
  var list = byLevel(activeLevel);
  var counts = {};
  list.forEach(function(e){counts[e.category]=(counts[e.category]||0)+1;});
  var html = '<button class="chip '+(activeCat==="all"?"active":"")+'" data-cat="all">全部 <span class="cnt">'+list.length+'</span></button>';
  Object.entries(CATS).forEach(function(entry){
    var k=entry[0], v=entry[1];
    if(counts[k]){
      html += '<button class="chip '+(activeCat===k?"active":"")+'" data-cat="'+k+'">'+v.emoji+' '+v.label+' <span class="cnt">'+counts[k]+'</span></button>';
    }
  });
  f.innerHTML = html;
  f.addEventListener("click", function(e){
    var b = e.target.closest(".chip");
    if(!b) return;
    f.querySelectorAll(".chip").forEach(function(c){c.classList.remove("active")});
    b.classList.add("active");
    activeCat = b.dataset.cat;
    render();
  });
}
renderFilters();

// 搜索
document.getElementById("search").addEventListener("input", function(e){
  query = e.target.value.toLowerCase().trim();
  render();
});

function render(){
  var grid = document.getElementById("grid");
  var list = byLevel(activeLevel);
  if(activeCat !== "all") list = list.filter(function(e){return e.category === activeCat});
  if(query) list = list.filter(function(e){return (e.title+" "+e.desc).toLowerCase().includes(query)});
  if(!list.length){
    grid.innerHTML = '<div class="no-results"><div class="big">🔭</div><h3>没有找到相关课程</h3><p>试试其他级别或关键词</p></div>';
  } else {
    grid.innerHTML = list.map(function(e){return renderCard(e, true)}).join("");
  }
  // 绑定复选框事件
  document.querySelectorAll('.vocab-cb').forEach(function(cb){
    cb.addEventListener('change', updateReviewButton);
  });
  updateReviewButton();
}
render();
</script>
</body>
</html>
